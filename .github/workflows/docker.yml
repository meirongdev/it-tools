name: Build and push Docker image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # 每周一 04:00 UTC 定时重建。
  #
  # WHY：最终镜像里只有 dist/ + nginx.conf，没有 node_modules —— 它的 CVE 状况完全
  # 等于运行期 nginx base 的新鲜度，与本仓库代码无关。没有定时重建的话，只要一段时间
  # 不提交，镜像就静默腐化：2026-08 就发生过一次，Trivy 在 oracle-k3s 上报出 3 条
  # Critical（含 nginx 1.28.2-r1 的 CVE-2026-42945 任意代码执行, CVSS 8.1），而同期
  # base 早已修好，纯粹是几个月没重建。
  #
  # 定时跑只在默认分支触发；tag 用 type=sha → 同一个 sha-* tag 会被换成内容更新的
  # 镜像（代码没变、base 变新）。消费端要吃到这个刷新需要 imagePullPolicy: Always
  # （homelab 侧 it-tools 清单已这么配）。
  schedule:
    - cron: "0 4 * * 1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Run unit tests
        run: pnpm test

      - name: Build the app
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
